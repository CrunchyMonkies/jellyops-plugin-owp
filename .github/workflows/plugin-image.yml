name: Build & Publish Plugin Image

# Packages the upstream mhbxyz/OpenWatchParty release artifact (OpenWatchParty-v<ver>.zip:
# net10.0, Jellyfin.Controller 12.0.0, targetAbi 12.0.0.0) plus the jellyops hooks into a
# FROM-scratch image-volume payload and pushes it to GHCR. Provenance is disabled so the
# kubelet mounts it cleanly as an image volume. Nothing is compiled; no secrets beyond
# GITHUB_TOKEN are needed (the upstream repo is public).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      owp_tag:
        description: "mhbxyz/OpenWatchParty release tag to package"
        required: true
        default: "v0.8.0"
      owp_sha256:
        description: "SHA-256 of OpenWatchParty-<tag>.zip (required when changing owp_tag)"
        required: true
        default: "f86145bf14f7414bda2ab2925565d00198a46d7bf346ccd0186136002dd70cdd"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}/plugin
  OWP_REPO: mhbxyz/OpenWatchParty
  OWP_TAG: ${{ github.event.inputs.owp_tag || 'v0.8.0' }}
  OWP_SHA256: ${{ github.event.inputs.owp_sha256 || 'f86145bf14f7414bda2ab2925565d00198a46d7bf346ccd0186136002dd70cdd' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download, verify and stage the upstream payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="OpenWatchParty-${OWP_TAG}.zip"
          gh release download "${OWP_TAG}" --repo "${OWP_REPO}" --pattern "${asset}" --dir . --clobber
          echo "${OWP_SHA256}  ${asset}" | sha256sum -c -
          mkdir -p plugin
          unzip -o -q "${asset}" -d plugin
          cp scripts/firstrun.sh scripts/bootstrap.sh plugin/
          chmod +x plugin/firstrun.sh plugin/bootstrap.sh
          for f in OpenWatchPartyPlugin.dll meta.json firstrun.sh bootstrap.sh; do test -f "plugin/$f"; done
          # Host assemblies must resolve from the host ALC; fail if a release starts shipping them.
          leaked="$(find plugin -maxdepth 1 -type f \( -name 'Emby.*' -o -name 'MediaBrowser.*' \
            -o -name 'Newtonsoft.*' -o \( -name 'Jellyfin.*' -a ! -name 'OpenWatchParty*' \) \))"
          if [ -n "$leaked" ]; then
            echo "forbidden assemblies leaked into payload:" >&2; echo "$leaked" >&2; exit 1
          fi
          # The Dockerfile labels must match the payload's meta.json.
          version="$(jq -r .version plugin/meta.json)"; abi="$(jq -r .targetAbi plugin/meta.json)"
          grep -q "io.jellyops.plugin.version=\"${version}\"" docker/Dockerfile.plugin \
            || { echo "Dockerfile version label != meta.json version ${version}" >&2; exit 1; }
          grep -q "io.jellyops.plugin.targetAbi=\"${abi}\"" docker/Dockerfile.plugin \
            || { echo "Dockerfile targetAbi label != meta.json targetAbi ${abi}" >&2; exit 1; }
          echo "Payload (version ${version}, targetAbi ${abi}):"; ls -1 plugin

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build & push (provenance disabled)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.plugin
          push: true
          provenance: false
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### OpenWatchParty plugin image published"
            echo ""
            echo "- Payload: \`${OWP_REPO}\` @ \`${OWP_TAG}\` (sha256 \`${OWP_SHA256}\`)"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "Pin in \`k8s/30-jellyfinplugin.yaml\` (spec.pluginImage.reference):"
            echo ""
            echo '```'
            echo "${IMAGE}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
