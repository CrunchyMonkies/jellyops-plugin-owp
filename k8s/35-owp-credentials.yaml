# Shared JWT secret for OpenWatchParty — consumed by BOTH the plugin (signs per-user tokens,
# via firstrun-seeded OpenWatchParty.Plugin.xml) and the session server (validates them,
# via env JWT_SECRET). The two MUST use the identical value or every WebSocket auth fails.
#
# The session server enforces >= 32 chars and a minimum entropy; generate a strong key:
#   kubectl -n jellyfin create secret generic owp-creds \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)"
#
# This manifest is a TEMPLATE with a placeholder — do NOT commit a real secret. Prefer the
# imperative command above, or a SealedSecret/ExternalSecret in GitOps.
apiVersion: v1
kind: Secret
metadata:
  name: owp-creds
  namespace: jellyfin
  labels:
    jellyfin.jellyops.io/instance: home-media
type: Opaque
stringData:
  # >= 32 chars, high entropy. REPLACE before applying (or create imperatively).
  jwt-secret: "REPLACE_ME_WITH_openssl_rand_base64_48"
