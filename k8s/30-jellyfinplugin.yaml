# OpenWatchParty plugin, delivered by JellyOps to the home-media instance — COMPANION mode:
# this CR also runs the upstream Rust session server as a companion workload.
#
# - pluginImage: the plugin-only image-volume payload — the unmodified upstream
#   mhbxyz/OpenWatchParty v0.8.0 release zip (OpenWatchPartyPlugin.dll + IdentityModel/JWT DLLs +
#   meta.json; net10.0, targetAbi 12.0.0.0) plus firstrun.sh/bootstrap.sh at root.
#   injection: imageVolumeCopy — staged into a writable /config/plugins dir so Jellyfin can write
#   meta.json status at runtime.
# - install: the hooks baked into the plugin image. firstrun.sh (once) seeds
#   OpenWatchPartyPlugin.xml from env/Secret — the JWT secret (SHARED with the session server),
#   the public wss:// session URL, audience/issuer/TTLs. bootstrap.sh (every start) removes
#   superseded OpenWatchParty_* dirs (e.g. the old 1.0.1.0 source-port build, which would
#   otherwise outrank 0.8.0.0).
# - Requires a Jellyfin v12 server >= ABI 12.0.0.0 (deployed: v12.3-jc-0.2.4).
# - services: a ClusterIP Service exposing the session server's :3000 (REST /health + WS /ws).
# - workloads: the upstream owp-session-server 0.8.0 (Rust WebSocket sync server, WebSocket
#   protocol v1 — matches the v0.8.0 plugin/client), pinned by digest.
#
# REQUIRES:
#   * a web-serving (non-split) Jellyfin instance: the plugin injects its client loader into the
#     server's own index.html response (native middleware). The File Transformation plugin is no
#     longer required (upstream treats it as an optional fallback).
#   * the owp-creds Secret (jwt-secret) — see 35-owp-credentials.yaml — shared by BOTH the plugin
#     (mints tokens) and the session server (validates them). Must be Base64 of >= 32 random bytes.
#   * the /owp HTTPRoute — see 40-httproute-ws.yaml (serves /owp/ws and /owp/invite).
#
# Pin spec.pluginImage.reference to the @sha256 digest printed by docker/build-push.sh.
apiVersion: jellyfin.jellyops.io/v1alpha1
kind: JellyfinPlugin
metadata:
  name: owp
  namespace: jellyfin
  labels:
    jellyfin.jellyops.io/instance: home-media
spec:
  jellyfinRef:
    name: jellyfin
  pluginImage:
    reference: ghcr.io/crunchymonkies/jellyops-plugin-owp/plugin@sha256:7eb501b303cbb9de95c2cf77ab5e59f723bce1f51d02b8fed40d51f6b941c3dc
    pullPolicy: IfNotPresent
  meta:
    guid: 0f2fd0fd-09ff-4f49-9f1c-4a8f421a4b7d
    name: "OpenWatchParty"
    version: "0.8.0.0"
    targetAbi: "12.0.0.0"
  injection: imageVolumeCopy
  install:
    # No inline script: jellyops auto-runs firstrun.sh (once per instance) from the plugin image
    # to seed OpenWatchPartyPlugin.xml. This block supplies the helper image + env the hook reads.
    image:
      reference: alpine:3
    env:
      # The public WebSocket URL the browser dials (served by the /owp HTTPRoute -> :3000/ws).
      - name: OWP_SESSION_SERVER_URL
        value: wss://jellyfin.bne1.ouchi.com.au/owp/ws
      - name: OWP_JWT_AUDIENCE
        value: OpenWatchParty
      - name: OWP_JWT_ISSUER
        value: Jellyfin
      - name: OWP_TOKEN_TTL_SECONDS
        value: "3600"
      - name: OWP_INVITE_TTL_SECONDS
        value: "3600"
      # SHARED secret — the plugin signs tokens the session server verifies. Same key as the
      # session-server JWT_SECRET below.
      - name: OWP_JWT_SECRET
        valueFrom: { secretKeyRef: { name: owp-creds, key: jwt-secret } }
    failurePolicy: Ignore # Jellyfin still boots if the seed errors (fail-open)
    timeoutSeconds: 120
  services:
    - name: owp-session-server
      selector: workload:owp-session-server
      ports:
        - name: http
          port: 3000
          targetPort: 3000
  workloads:
    - name: owp-session-server
      image:
        # Upstream Rust session server 0.8.0 (multi-arch index; the kubelet selects amd64). Pinned
        # by the OCI index digest — matches the v0.8.0 release provenance and upstream's docs.
        reference: ghcr.io/mhbxyz/owp-session-server:0.8.0@sha256:e0634bf2fafd59bcb612c0ec93cb7e54190eb5b00c8c37ee0680b9e92ee29f68
        pullPolicy: IfNotPresent
      replicas: 1 # in-memory room state — single instance (do not scale without shared state)
      ports:
        - name: http
          containerPort: 3000
      env:
        - { name: HOST, value: "0.0.0.0" }
        - { name: PORT, value: "3000" }
        # Browser Origin when the web client opens the WebSocket from the Jellyfin page.
        - { name: ALLOWED_ORIGINS, value: "https://jellyfin.bne1.ouchi.com.au" }
        - { name: JWT_AUDIENCE, value: "OpenWatchParty" }
        - { name: JWT_ISSUER, value: "Jellyfin" }
        - name: JWT_SECRET
          valueFrom: { secretKeyRef: { name: owp-creds, key: jwt-secret } }
      resources:
        requests:
          cpu: "50m"
          memory: 64Mi
        limits:
          memory: 256Mi
      readinessProbe:
        httpGet:
          path: /health
          port: 3000
        initialDelaySeconds: 3
        periodSeconds: 10
